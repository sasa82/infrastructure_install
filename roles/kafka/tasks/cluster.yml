---
- name: Build cluster node facts dynamically from inventory
  set_fact:
    kafka_node_id: "{{ groups['kafka'].index(inventory_hostname) + 1 }}"
    kafka_node_host: "{{ ansible_host | default(inventory_hostname) }}"
    kafka_node_roles: "broker,controller"
    kafka_quorum_voters: >-
      {{ groups['kafka'] | map('extract', hostvars, ['ansible_host']) 
      | default(groups['kafka']) 
      | enumerate(start=1) 
      | map('join', '@') 
      | map('regex_replace', '$', ':' + kafka_controller_port | string) 
      | join(',') }}

- name: Generate KRaft cluster ID on first node
  command: /opt/kafka/bin/kafka-storage.sh random-uuid
  register: kafka_uuid
  changed_when: false
  run_once: true

- name: Set cluster ID fact on all nodes
  set_fact:
    kafka_cluster_id: "{{ kafka_uuid.stdout }}"

- name: Deploy Kafka server config
  template:
    src: server.properties.j2
    dest: /opt/kafka/config/server.properties
    owner: kafka
    group: kafka
    mode: "0644"
  notify: restart kafka

- name: Format Kafka storage
  command: >
    /opt/kafka/bin/kafka-storage.sh format
    -t {{ kafka_cluster_id }}
    -c /opt/kafka/config/server.properties
  args:
    creates: "{{ kafka_data_path }}/meta.properties"
  become_user: kafka
