---
- name: Install Java
  apt:
    name: "openjdk-{{ java_version }}-jdk"
    state: present
    update_cache: yes

- name: Create kafka group
  group:
    name: kafka
    state: present

- name: Create kafka user
  user:
    name: kafka
    group: kafka
    shell: /bin/false
    create_home: false
    state: present

- name: Create Kafka directories
  file:
    path: "{{ item }}"
    state: directory
    owner: kafka
    group: kafka
    mode: "0755"
  loop:
    - "{{ kafka_data_path }}"
    - "{{ kafka_log_path }}"
    - /opt/kafka

- name: Download Kafka
  get_url:
    url: "https://downloads.apache.org/kafka/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
    dest: "/tmp/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
    mode: "0644"

- name: Extract Kafka
  unarchive:
    src: "/tmp/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
    dest: /opt/kafka
    remote_src: yes
    extra_opts: ['--strip-components=1']
    owner: kafka
    group: kafka

- name: Create Kafka systemd service
  template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    mode: "0644"
  notify: restart kafka

- name: Reload systemd
  systemd:
    daemon_reload: yes
