## ─── Network ───────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no

## ─── Systemd Integration ───────────────────────────────────────
supervised no

## ─── Security ──────────────────────────────────────────────────
requirepass changeme

## ─── Storage ───────────────────────────────────────────────────
dir /data

## ─── Logging ───────────────────────────────────────────────────
logfile ""
loglevel notice

## ─── Memory ────────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru

## ─── Persistence ───────────────────────────────────────────────
save 900 1
save 300 10
save 60 10000
appendonly no
