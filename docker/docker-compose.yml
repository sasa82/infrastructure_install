name: infrastructure

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "${DOCKER_BIND_IP:-127.0.0.1}"

services:

  ### ─── ClickHouse Node 1 ───────────────────────────────────────
  ch-node1:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.4.2.10}
    container_name: ch-node1
    profiles: ["clickhouse", "all"]
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_node1_data:/var/lib/clickhouse
      - ch_node1_logs:/var/log/clickhouse-server
      - ./clickhouse/node1/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ### ─── ClickHouse Node 2 ───────────────────────────────────────
  ch-node2:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.4.2.10}
    container_name: ch-node2
    profiles: ["clickhouse", "all"]
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ch_node2_data:/var/lib/clickhouse
      - ch_node2_logs:/var/log/clickhouse-server
      - ./clickhouse/node2/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ### ─── Kafka Node 1 ────────────────────────────────────────────
  kafka1:
    image: apache/kafka:${KAFKA_VERSION:-4.2.0}
    container_name: kafka1
    profiles: ["kafka", "all"]
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,EXTERNAL://${KAFKA_HOST:-127.0.0.1}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9096
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_HEAP_OPTS: "-Xmx${KAFKA_HEAP_SIZE:-512M} -Xms${KAFKA_HEAP_SIZE:-512M}"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-sUBTZ4oMStqbq2CdjCThRA}
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka1:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  ### ─── Kafka Node 2 ────────────────────────────────────────────
  kafka2:
    image: apache/kafka:${KAFKA_VERSION:-4.2.0}
    container_name: kafka2
    profiles: ["kafka", "all"]
    ports:
      - "9095:9095"
      - "9096:9096"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9095,EXTERNAL://0.0.0.0:9097,CONTROLLER://0.0.0.0:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9095,EXTERNAL://${KAFKA_HOST:-127.0.0.1}:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9096
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_HEAP_OPTS: "-Xmx${KAFKA_HEAP_SIZE:-512M} -Xms${KAFKA_HEAP_SIZE:-512M}"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-sUBTZ4oMStqbq2CdjCThRA}
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka2:9095"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  ### ─── PostgreSQL ──────────────────────────────────────────────
  postgresql:
    image: postgres:${POSTGRESQL_VERSION:-16}
    container_name: postgresql
    profiles: ["postgresql", "all"]
    ports:
      - "${POSTGRESQL_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRESQL_DB:-postgres}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ### ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:${REDIS_VERSION:-8}
    container_name: redis
    profiles: ["redis", "all"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ch_node1_data:
  ch_node1_logs:
  ch_node2_data:
  ch_node2_logs:
  kafka1_data:
  kafka2_data:
  postgresql_data:
  redis_data:

